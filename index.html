<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Spese</title>
<style>
:root{--bg:#f6f7f8;--card:#fff;--tx:#1b1f23;--mu:#6b7280;--ac:#0f766e;--out:#dc2626;--in:#16a34a;--bd:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#111315;--card:#1b1e21;--tx:#eceff1;--mu:#9aa3ab;--ac:#2dd4bf;--out:#f87171;--in:#4ade80;--bd:#2c3136}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding-bottom:76px}
main{max-width:560px;margin:auto;padding:16px}
h1{font-size:22px;margin:4px 0 14px}h2{font-size:15px;color:var(--mu);margin:20px 0 8px;font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mu{color:var(--mu);font-size:13px}.out{color:var(--out)}.in{color:var(--in)}.big{font-size:26px;font-weight:700}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd)}
nav button{flex:1;padding:14px 0;border:0;background:none;color:var(--mu);font-size:14px}
nav button.on{color:var(--ac);font-weight:700}
#fab{position:fixed;right:18px;bottom:76px;width:58px;height:58px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:32px;box-shadow:0 4px 12px #0004}
input,select{width:100%;padding:12px;margin:4px 0 10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:16px}
label{font-size:13px;color:var(--mu)}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:16px;margin:6px 0}
.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.btn.d{background:var(--out)}
.seg{display:flex;gap:8px;margin-bottom:10px}.seg button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px}
.seg button.on.o{background:var(--out);color:#fff}.seg button.on.i{background:var(--in);color:#fff}
#modal{display:none;position:fixed;inset:0;background:#0007;align-items:flex-end;z-index:9}
#modal.show{display:flex}#sheet{background:var(--bg);width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px;max-width:560px;margin:auto}
.x{background:none;border:0;color:var(--out);font-size:20px;padding:0 6px}
</style>
</head>
<body>
<main id="app"></main>
<button id="fab" onclick="openForm()">+</button>
<nav>
 <button data-t="home" class="on">Home</button>
 <button data-t="mov">Movimenti</button>
 <button data-t="set">Impostazioni</button>
</nav>
<div id="modal"><div id="sheet"></div></div>
<script src="xlsx.full.min.js"></script>
<script>
/* ---------- Dati (IndexedDB, un solo record "db") ---------- */
let DB={conti:[],categorie:[],movimenti:[],ultimoExport:null};
const idb=()=>new Promise((ok,ko)=>{const r=indexedDB.open('spese',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=ko});
async function load(){const d=await idb();return new Promise(ok=>{const q=d.transaction('kv').objectStore('kv').get('db');q.onsuccess=()=>{if(q.result)DB=q.result;ok()}})}
async function save(){const d=await idb();return new Promise(ok=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(DB,'db');t.oncomplete=ok})}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();

/* ---------- Utilità ---------- */
const $=s=>document.querySelector(s);
const oggi=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const eur=n=>n.toLocaleString('it-IT',{style:'currency',currency:'EUR'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const segno=m=>m.tipo==='Entrata'?1:-1;
const nomeConto=id=>(DB.conti.find(c=>c.id===id)||{}).nome||'?';
const nomeCat=id=>(DB.categorie.find(c=>c.id===id)||{}).nome||'—';
const saldo=c=>c.saldo_iniziale+DB.movimenti.filter(m=>m.conto===c.id).reduce((s,m)=>s+segno(m)*m.importo,0);
let tab='home',mese=oggi().slice(0,7),filtri={conto:'',cat:''};

/* ---------- Schermate ---------- */
function riga(m){return `<div class="card row" onclick="openForm('${m.id}')"><div><b>${esc(nomeCat(m.categoria))}</b><div class="mu">${m.data} · ${esc(nomeConto(m.conto))}${m.nota?' · '+esc(m.nota):''}</div></div><b class="${m.tipo==='Entrata'?'in':'out'}">${m.tipo==='Entrata'?'+':'−'}${eur(m.importo)}</b></div>`}
function render(){
 const el=$('#app');
 if(tab==='home'){
  const mm=DB.movimenti.filter(m=>m.data.startsWith(oggi().slice(0,7)));
  const e=mm.filter(m=>m.tipo==='Entrata').reduce((s,m)=>s+m.importo,0),u=mm.filter(m=>m.tipo==='Uscita').reduce((s,m)=>s+m.importo,0);
  const tot=DB.conti.reduce((s,c)=>s+saldo(c),0);
  const gg=DB.ultimoExport?Math.floor((Date.now()-DB.ultimoExport)/864e5):null;
  el.innerHTML=`<h1>Spese</h1>
  <div class="card"><div class="mu">Saldo totale</div><div class="big">${eur(tot)}</div>
  ${DB.conti.map(c=>`<div class="row mu"><span>${esc(c.nome)}</span><span>${eur(saldo(c))}</span></div>`).join('')}</div>
  <div class="card row"><div><div class="mu">Entrate del mese</div><b class="in">${eur(e)}</b></div><div><div class="mu">Uscite del mese</div><b class="out">${eur(u)}</b></div></div>
  ${gg===null||gg>=14?`<div class="card mu">⚠️ ${gg===null?'Non hai ancora fatto nessun export.':'Ultimo export: '+gg+' giorni fa.'} Esporta per avere un backup.</div>`:''}
  <h2>Ultimi movimenti</h2>${[...DB.movimenti].sort((a,b)=>b.data.localeCompare(a.data)).slice(0,8).map(riga).join('')||'<div class="mu">Nessun movimento. Premi + per iniziare.</div>'}`;
 }
 if(tab==='mov'){
  const ms=[...new Set([mese,...DB.movimenti.map(m=>m.data.slice(0,7))])].sort().reverse();
  const mm=DB.movimenti.filter(m=>m.data.startsWith(mese)&&(!filtri.conto||m.conto===filtri.conto)&&(!filtri.cat||m.categoria===filtri.cat)).sort((a,b)=>b.data.localeCompare(a.data));
  const tot=mm.reduce((s,m)=>s+segno(m)*m.importo,0);
  el.innerHTML=`<h1>Movimenti</h1>
  <select onchange="mese=this.value;render()">${ms.map(x=>`<option ${x===mese?'selected':''}>${x}</option>`).join('')}</select>
  <select onchange="filtri.conto=this.value;render()"><option value="">Tutti i conti</option>${DB.conti.map(c=>`<option value="${c.id}" ${filtri.conto===c.id?'selected':''}>${esc(c.nome)}</option>`).join('')}</select>
  <select onchange="filtri.cat=this.value;render()"><option value="">Tutte le categorie</option>${DB.categorie.map(c=>`<option value="${c.id}" ${filtri.cat===c.id?'selected':''}>${esc(c.nome)}</option>`).join('')}</select>
  <div class="mu" style="margin-bottom:8px">${mm.length} movimenti · netto <b>${eur(tot)}</b></div>${mm.map(riga).join('')}`;
 }
 if(tab==='set'){
  el.innerHTML=`<h1>Impostazioni</h1>
  <h2>Conti</h2>${DB.conti.map(c=>`<div class="card row"><span>${esc(c.nome)} <span class="mu">(iniziale ${eur(c.saldo_iniziale)})</span></span><button class="x" onclick="del('conti','${c.id}')">✕</button></div>`).join('')}
  <button class="btn s" onclick="addConto()">+ Aggiungi conto</button>
  <h2>Categorie</h2>${DB.categorie.map(c=>`<div class="card row"><span>${esc(c.nome)} <span class="mu">(${c.tipo})</span></span><button class="x" onclick="del('categorie','${c.id}')">✕</button></div>`).join('')}
  <button class="btn s" onclick="addCat()">+ Aggiungi categoria</button>
  <h2>Excel</h2>
  <button class="btn" onclick="esporta()">Esporta Excel</button>
  <button class="btn s" onclick="$('#file').click()">Importa Excel</button>
  <button class="btn s" onclick="modello()">Scarica modello vuoto</button>
  <input type="file" id="file" accept=".xlsx,.xls" hidden onchange="importa(this.files[0]);this.value=''">`;
 }
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));render()});

/* ---------- Form movimento ---------- */
let ftipo='Uscita';
function openForm(id){
 if(!DB.conti.length||!DB.categorie.length){alert('Prima crea almeno un conto e una categoria in Impostazioni.');return}
 const m=DB.movimenti.find(x=>x.id===id)||{tipo:'Uscita',data:oggi(),importo:'',nota:'',conto:DB.conti[0].id,categoria:''};
 ftipo=m.tipo;
 $('#sheet').innerHTML=`<h1>${id?'Modifica':'Nuovo'} movimento</h1>
 <div class="seg"><button id="bo" class="o" onclick="setTipo('Uscita')">Uscita</button><button id="bi" class="i" onclick="setTipo('Entrata')">Entrata</button></div>
 <label>Importo</label><input id="f_imp" type="number" inputmode="decimal" step="0.01" value="${m.importo}">
 <label>Conto</label><select id="f_conto">${DB.conti.map(c=>`<option value="${c.id}" ${c.id===m.conto?'selected':''}>${esc(c.nome)}</option>`).join('')}</select>
 <label>Categoria</label><select id="f_cat"></select>
 <label>Data</label><input id="f_data" type="date" value="${m.data}">
 <label>Nota</label><input id="f_nota" value="${esc(m.nota)}">
 <button class="btn" onclick="salvaMov('${id||''}')">Salva</button>
 ${id?`<button class="btn d" onclick="delMov('${id}')">Elimina</button>`:''}
 <button class="btn s" onclick="chiudi()">Annulla</button>`;
 $('#modal').classList.add('show');setTipo(ftipo,m.categoria);
}
function setTipo(t,sel){
 ftipo=t;$('#bo').classList.toggle('on',t==='Uscita');$('#bi').classList.toggle('on',t==='Entrata');
 const cur=sel||$('#f_cat').value;
 $('#f_cat').innerHTML=DB.categorie.filter(c=>c.tipo===t).map(c=>`<option value="${c.id}" ${c.id===cur?'selected':''}>${esc(c.nome)}</option>`).join('');
}
const chiudi=()=>$('#modal').classList.remove('show');
async function salvaMov(id){
 const imp=parseFloat($('#f_imp').value);
 if(!(imp>0)||!$('#f_cat').value||!$('#f_data').value){alert('Controlla importo, categoria e data.');return}
 const o={id:id||uid(),tipo:ftipo,importo:Math.round(imp*100)/100,conto:$('#f_conto').value,categoria:$('#f_cat').value,data:$('#f_data').value,nota:$('#f_nota').value.trim()};
 if(id)DB.movimenti[DB.movimenti.findIndex(m=>m.id===id)]=o;else DB.movimenti.push(o);
 await save();chiudi();render();
}
async function delMov(id){if(!confirm('Eliminare il movimento?'))return;DB.movimenti=DB.movimenti.filter(m=>m.id!==id);await save();chiudi();render()}

/* ---------- Conti e categorie ---------- */
async function addConto(){
 const n=(prompt('Nome del conto:')||'').trim();if(!n)return;
 const s=parseFloat((prompt('Saldo iniziale (es. 1200):','0')||'0').replace(',','.'))||0;
 DB.conti.push({id:uid(),nome:n,saldo_iniziale:s});await save();render();
}
async function addCat(){
 const n=(prompt('Nome della categoria:')||'').trim();if(!n)return;
 const t=confirm('OK = categoria di USCITA\nAnnulla = categoria di ENTRATA')?'Uscita':'Entrata';
 DB.categorie.push({id:uid(),nome:n,tipo:t});await save();render();
}
async function del(k,id){
 const campo=k==='conti'?'conto':'categoria';
 const n=DB.movimenti.filter(m=>m[campo]===id).length;
 if(n){alert(`Non posso eliminarlo: è usato da ${n} movimenti.`);return}
 if(!confirm('Eliminare?'))return;DB[k]=DB[k].filter(x=>x.id!==id);await save();render();
}

/* ---------- Excel: formato standard a 3 fogli ---------- */
function scarica(wb,nome){XLSX.writeFile(wb,nome)}
function costruisci(vuoto){
 const wb=XLSX.utils.book_new();
 const conti=vuoto?[{nome:'Conto corrente',saldo_iniziale:1200}]:DB.conti.map(c=>({nome:c.nome,saldo_iniziale:c.saldo_iniziale}));
 const cat=vuoto?[{nome:'Spesa',tipo:'Uscita'},{nome:'Stipendio',tipo:'Entrata'}]:DB.categorie.map(c=>({nome:c.nome,tipo:c.tipo}));
 const mov=vuoto?[{data:'2026-10-02',tipo:'Uscita',importo:23.5,conto:'Conto corrente',categoria:'Spesa',nota:'Supermercato'}]
  :[...DB.movimenti].sort((a,b)=>a.data.localeCompare(b.data)).map(m=>({data:m.data,tipo:m.tipo,importo:m.importo,conto:nomeConto(m.conto),categoria:nomeCat(m.categoria),nota:m.nota}));
 const H={Conti:['nome','saldo_iniziale'],Categorie:['nome','tipo'],Movimenti:['data','tipo','importo','conto','categoria','nota']};
 [['Conti',conti],['Categorie',cat],['Movimenti',mov]].forEach(([n,d])=>{const ws=XLSX.utils.json_to_sheet(d,{header:H[n]});ws['!cols']=H[n].map(()=>({wch:18}));XLSX.utils.book_append_sheet(wb,ws,n)});
 return wb;
}
async function esporta(){scarica(costruisci(false),`spese_${oggi()}.xlsx`);DB.ultimoExport=Date.now();await save()}
function modello(){scarica(costruisci(true),'modello_spese.xlsx')}

function dataISO(v){
 if(v instanceof Date)return new Date(v-v.getTimezoneOffset()*6e4).toISOString().slice(0,10);
 if(typeof v==='number'){const d=XLSX.SSF.parse_date_code(v);return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`}
 const s=String(v||'').trim(),m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);
 return m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:s.slice(0,10);
}
const num=v=>typeof v==='number'?v:parseFloat(String(v||'').replace(',','.'));
const tipoOk=v=>{const t=String(v||'').trim().toLowerCase();return t==='entrata'?'Entrata':t==='uscita'?'Uscita':null};

async function importa(file){
 if(!file)return;
 try{
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});
  for(const f of ['Conti','Categorie','Movimenti'])if(!wb.Sheets[f]){alert(`Manca il foglio "${f}". Scarica il modello vuoto per vedere il formato.`);return}
  const rd=n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{defval:''});
  const sost=confirm('Come importare?\n\nOK = SOSTITUISCI tutti i dati attuali\nAnnulla = AGGIUNGI ai dati esistenti');
  const nuovo=sost?{conti:[],categorie:[],movimenti:[]}:{conti:[...DB.conti],categorie:[...DB.categorie],movimenti:[...DB.movimenti]};
  const trovaConto=n=>nuovo.conti.find(c=>c.nome.toLowerCase()===String(n).trim().toLowerCase());
  const trovaCat=(n,t)=>nuovo.categorie.find(c=>c.nome.toLowerCase()===String(n).trim().toLowerCase()&&c.tipo===t);
  rd('Conti').forEach(r=>{const n=String(r.nome).trim();if(n&&!trovaConto(n))nuovo.conti.push({id:uid(),nome:n,saldo_iniziale:num(r.saldo_iniziale)||0})});
  rd('Categorie').forEach(r=>{const n=String(r.nome).trim(),t=tipoOk(r.tipo);if(n&&t&&!trovaCat(n,t))nuovo.categorie.push({id:uid(),nome:n,tipo:t})});
  let ok=0,err=[];
  rd('Movimenti').forEach((r,i)=>{
   const t=tipoOk(r.tipo),imp=Math.abs(num(r.importo)),d=dataISO(r.data),cn=String(r.conto).trim(),kn=String(r.categoria).trim();
   if(!t||!(imp>0)||!/^\d{4}-\d{2}-\d{2}$/.test(d)||!cn||!kn){err.push(i+2);return}
   let c=trovaConto(cn);if(!c){c={id:uid(),nome:cn,saldo_iniziale:0};nuovo.conti.push(c)}
   let k=trovaCat(kn,t);if(!k){k={id:uid(),nome:kn,tipo:t};nuovo.categorie.push(k)}
   nuovo.movimenti.push({id:uid(),tipo:t,importo:Math.round(imp*100)/100,conto:c.id,categoria:k.id,data:d,nota:String(r.nota||'').trim()});ok++;
  });
  Object.assign(DB,nuovo);await save();render();
  alert(`Importati ${ok} movimenti.`+(err.length?`\nRighe ignorate (dati non validi) nel foglio Movimenti: ${err.slice(0,20).join(', ')}`:''));
 }catch(e){alert('File non leggibile: '+e.message)}
}

/* ---------- Avvio ---------- */
load().then(render);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
